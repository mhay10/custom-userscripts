<div class="container-sm p-2 border rounded mt-3 mb-3" style="width: 300px">
	<!-- Download Button -->
	<button
		id="download-btn"
		class="btn btn-primary fw-bold w-100"
		data-status="ready"
	>
		Download
	</button>

	<!-- Program Status -->
	<div class="d-flex justify-content-between align-items-center small mt-3">
		<span id="instruction">---</span>
		<span>
			<span id="progress">-</span> / <span id="progress-total">-</span>
		</span>
	</div>

	<!-- Progress Bar -->
	<div class="progress mt-2">
		<div
			id="progress-bar"
			class="progress-bar"
			role="progressbar"
			style="width: 0"
			aria-valuemin="0"
			aria-valuemax="100"
		></div>
	</div>
</div>

<style>
	#download-btn[data-status="downloading"] {
		color: transparent;
		position: relative;
		pointer-events: none;
	}

	#download-btn[data-status="downloading"]::after {
		content: "Downloading...";
		color: white;
		position: absolute;
		inset: 0;
		display: grid;
		place-items: center;
	}
</style>
